# HR 管理系统 - 主配置文件
# 使用 spring.profiles.active 指定环境：dev | prod | test

spring:
  application:
    name: hr-system

  # 自动配置排除（可选）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

  # 数据源配置（具体值在 profile 文件中覆盖）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hr?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  # Thymeleaf 配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # SQL 初始化（仅 dev/test 环境）
  sql:
    init:
      mode: never

# JWT 配置
jwt:
  secret: mySecretKeyForJWTTokenGenerationWhichIsLongEnoughForHS512Algorithm
  expiration: 86400000

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/com/renxuanchen/mapper/xml/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 工作时间配置
work-up-time: 9
work-down-time: 18
work-over-time: 20

# 日志配置
logging:
  level:
    root: INFO
    com.renxuanchen: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# LangChain4j AI 配置（具体值在 profile 文件中覆盖）
langchain4j:
  open-ai:
    chat-model:
      api-key: ${HUNYUAN_API_KEY:your-api-key-here}
      base-url: https://api.hunyuan.cloud.tencent.com/v1
      model-name: hunyuan-lite
      timeout: 60s